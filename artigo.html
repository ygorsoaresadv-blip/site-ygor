<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artigo · Ygor Soares</title>
<meta name="robots" content="noindex">
<!-- Endereço antigo dos artigos (artigo.html?post=...). Cada artigo agora tem a sua
     própria página em artigos/<endereço>.html; este arquivo só leva os links já
     compartilhados para o lugar novo. A regra do endereço é a mesma de
     scripts/gerar-site.mjs (sem acentos nem símbolos). -->
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var slug = params.get('post') || params.get('a') || '';
    var limpo = slug.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    location.replace(limpo ? 'artigos/' + limpo + '.html' : 'index.html#artigos');
  })();
</script>
</head>
<body>
<p>Redirecionando… <a href="index.html#artigos">Ver todos os artigos</a></p>
</body>
</html>
