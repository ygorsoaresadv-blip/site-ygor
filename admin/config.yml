backend:
  name: github
  repo: ygorsoaresadv-blip/site-ygor
  branch: main
  base_url: https://decap-oauth-site-ygor.ygorsoaresadv.workers.dev
  auth_endpoint: auth

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Artigo"
    folder: "posts"
    create: true
    delete: true
    identifier_field: titulo
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Data", name: "data", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Resumo", name: "resumo", widget: "text", hint: "Aparece no card, no topo do artigo e no Google." }
      - { label: "Tema", name: "tema", widget: "select", options: ["Rescisão", "Jornada", "Vínculo", "Salário", "Saúde e segurança", "Processo", "Categorias", "Além do trabalho"], hint: "Aparece no card e no filtro da home. Um tema por artigo." }
      - { label: "Palavras-chave", name: "tags", widget: "string", required: false, hint: "Opcional. Ajudam a busca do site a encontrar o artigo. Separe por vírgula." }
      - { label: "Conteúdo", name: "body", widget: "markdown" }
