name: Gerar páginas do blog

on:
  push:
    branches: [main]
    paths:
      - "posts/**.md"
      - "scripts/**"
      - "assets/js/md.js"
      - "index.html"
      - "calculadora.html"
      - "privacidade.html"
      - "404.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-site
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar índice, páginas dos artigos, home, sitemap e RSS
        run: node scripts/gerar-site.mjs

      - name: Publicar o que mudou
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: gerar páginas do blog"
          git push
